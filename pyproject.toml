[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-sort-player"
version = "0.2.7"
description = "Fast local browser-based file sorter and pixel inspector"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pillow>=11",
  "pillow-heif>=1.1",
  "pymupdf>=1.25",
  "imageio-ffmpeg>=0.6",
  "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
quick-sort-player = "quicksortplayer.dev:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
