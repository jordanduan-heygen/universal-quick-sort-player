name: Windows compatibility

on:
  push:
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Verify Windows launch scripts
        shell: pwsh
        run: |
          if (-not (Test-Path setup.cmd)) { throw "setup.cmd is missing" }
          if (-not (Test-Path run.cmd)) { throw "run.cmd is missing" }
          if (-not (Test-Path run-dev.cmd)) { throw "run-dev.cmd is missing" }
          if (-not (Test-Path 'Quick Sort Player.cmd')) { throw "One-click Windows launcher is missing" }
