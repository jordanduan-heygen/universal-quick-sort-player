name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]" pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --clean QuickSortPlayer.spec
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: '& ".\dist\Quick Sort Player.exe" --help'
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\Quick Sort Player.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Quick Sort Player.exe" | Set-Content ".\dist\Quick Sort Player.exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Quick-Sort-Player-Windows
          path: |
            dist/Quick Sort Player.exe
            dist/Quick Sort Player.exe.sha256
          if-no-files-found: error
      - name: Attach EXE to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Quick Sort Player $tag" --generate-notes }
          gh release upload $tag ".\dist\Quick Sort Player.exe" ".\dist\Quick Sort Player.exe.sha256" --clobber
